[project]
name = "langchain-harness"
dynamic = ["version"]
description = "A Claude Code-style harness built on LangChain deepagents."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["langchain", "deepagents", "agents", "chatbot", "fastapi"]
classifiers = [
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "deepagents==0.7.19",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai",
    "langchain-anthropic",
    "langchain>=0.3.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "langgraph-checkpoint-sqlite==3.1.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
# Shared multi-replica persistence. Kept optional so local SQLite installs stay
# light; the container installs this extra.
postgres = [
    "langgraph-checkpoint-postgres==3.0.5",
    "psycopg[binary,pool]>=3.2.0",
]
# OIDC/JWT verification, needed only for [server] auth_modes = ["jwt"].
# Kept optional so the default token/trust modes install nothing extra.
jwt = [
    "PyJWT[crypto]>=2.8.0",
    "httpx>=0.27.0",
]

[project.scripts]
harness = "langchain_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/langchain_harness/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_harness"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
